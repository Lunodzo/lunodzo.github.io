- name: "AI-EFFECT"
  full_name: "Artificial Intelligence Experimentation Facility for the Energy Sector"
  status: current
  period: "Jul 2026 – Jan 2027"
  role: "Researcher"
  host: "Technical University of Denmark (DTU Wind and Energy Systems)"
  funder: "European Union (Grant Agreement 101172952)"
  link: "https://cordis.europa.eu/project/id/101172952"
  icon: "fa-microchip"
  summary: >-
    AI-EFFECT is building a European testing and experimentation facility for AI in the
    energy sector: a virtual network that links laboratories and computing resources across
    Denmark, Germany, the Netherlands and Portugal, so that AI solutions can be developed,
    tested and validated in realistic conditions, including compliance with the EU AI Act.
    DTU leads the Danish node, which tests AI in virtual and physical multi-energy systems.
  contributions:
    - "Implementing AI solution workflows and data pipelines"
    - "Deploying open-source platforms for use in SYSLAB, DTU's distributed energy laboratory"
  tags: ["AI", "Energy systems", "Data pipelines", "Testing & experimentation"]

